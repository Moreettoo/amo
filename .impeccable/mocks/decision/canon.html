<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O padrão da categoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --expresso:#2B1B16; --cobre:#C9784A; --cobre-texto:#9A5530; --creme:#FAF2E9; --papel:#FFFBF5; --suave:#5E4A40; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; font-family: Poppins, system-ui, sans-serif; background: var(--creme); color: var(--expresso); position: relative; }
  header { position: absolute; left: 96px; right: 96px; top: 0; height: 80px; display: flex; align-items: center; gap: 36px; font-size: 15px; }
  header .marca { font-size: 24px; font-weight: 600; letter-spacing: .2em; margin-right: auto; }
  header .cta { background: var(--expresso); color: var(--creme); padding: 12px 24px; border-radius: 999px; font-weight: 500; }
  .selo { position: absolute; left: 96px; top: 150px; font-size: 13px; font-weight: 500; background: var(--papel); border-radius: 999px; padding: 8px 16px; color: var(--cobre-texto); }
  h1 { position: absolute; left: 96px; top: 206px; width: 620px; font-size: 76px; line-height: 1.05; font-weight: 600; letter-spacing: -.03em; }
  .lead { position: absolute; left: 96px; top: 392px; width: 480px; font-size: 19px; line-height: 1.6; color: var(--suave); }
  .acoes { position: absolute; left: 96px; top: 488px; display: flex; gap: 16px; align-items: center; }
  .botao { background: var(--cobre); color: var(--expresso); padding: 17px 32px; border-radius: 999px; font-weight: 600; font-size: 16px; }
  .sec { border: 1px solid var(--expresso); padding: 16px 30px; border-radius: 999px; font-weight: 500; font-size: 16px; }
  .foto { position: absolute; left: 800px; top: 110px; width: 544px; height: 480px; border-radius: 24px; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
  .cards { position: absolute; left: 96px; right: 96px; top: 640px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .card { background: var(--papel); border-radius: 20px; height: 300px; overflow: hidden; }
  .card img { width: 100%; height: 190px; object-fit: cover; display: block; }
  .card p { padding: 16px 20px; font-weight: 600; font-size: 18px; }
</style>
</head>
<body>
  <header>
    <span class="marca">AMO</span>
    <span>Hoje o dia pede</span><span>O que é saudável</span><span>A marca</span>
    <span class="cta">Ver cardápio</span>
  </header>
  <span class="selo">Zero açúcar</span>
  <h1>Para quem ama comer bem.</h1>
  <p class="lead">Receitas em versão saudável. Cada uma diz no rótulo o que tem e o que não tem.</p>
  <div class="acoes"><span class="botao">Ver o cardápio</span><span class="sec">Escolher pela vontade</span></div>
  <div class="foto"><img src="http://localhost:3000/produtos/prestigio.webp" alt=""></div>
  <div class="cards">
    <div class="card"><img src="http://localhost:3000/produtos/prestigio.webp" alt=""><p>Prestígio</p></div>
    <div class="card"><img src="http://localhost:3000/produtos/pacoca.webp" alt=""><p>Paçoca</p></div>
    <div class="card"><img src="http://localhost:3000/produtos/mousse-de-maracuja.webp" alt=""><p>Mousse de maracujá</p></div>
    <div class="card"><img src="http://localhost:3000/produtos/chocolate.webp" alt=""><p>Chocolate</p></div>
  </div>
</body>
</html>
